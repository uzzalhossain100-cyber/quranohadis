<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08171257">
<meta name="theme-color" content="#081712">
<title>কুরআন ও হাদিস — প্রতিদিনের ইসলামিক সঙ্গী</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* অনুসন্ধান: অতিরিক্ত কার্ড/সেটিংস স্টাইল */
.qa-speechhint{margin:8px 4px 0;padding:10px 14px;font-size:12.5px;color:#8a6420;background:#fff8e8;border:1.5px solid #e8d9b8;border-radius:12px;line-height:1.7;text-align:center}
.qa-speechhint p{margin:0 0 5px}
.qa-speechhint p:last-child{margin:0}
.qa-vwarn{margin:0 0 10px;padding:10px 14px;border-radius:12px;background:#fff8e8;border:1.5px solid #e8d9b8;color:#8a6420;font-size:12.5px;line-height:1.8}
.qa-aitag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#7a5a26;background:#fdf6e3;border:1px solid #e8d9b8;border-radius:999px;padding:4px 12px;margin:6px 0}
.qa-row{display:flex;gap:10px;align-items:center}
.qa-mini{font-size:12px;color:#8a7f6a}
.qa-tag{display:inline-block;font-size:11.5px;background:#f6f1e6;color:#7a6a45;border-radius:999px;padding:3px 10px}
.qa-grow{flex:1}
.qa-chiprow{display:flex;gap:8px;flex-wrap:wrap}
.qa-chip{border:1.5px solid #e8ddc6;background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;color:#5f5237;cursor:pointer;font-family:inherit}
.qa-ref{display:block;font-family:inherit;font-size:12.5px;color:#6a5c3c;background:#f8f3e7;border:1px solid #e8ddc6;border-radius:10px;padding:8px 12px;margin:4px 0;text-align:right;cursor:pointer;line-height:1.6}
.qa-label{display:block;font-size:13px;font-weight:700;color:#5f5237;margin:14px 0 6px}
.qa-text{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;padding:11px 14px;border:2px solid #e3d7bc;border-radius:12px;background:#fdfcf9;min-height:76px;resize:vertical;line-height:1.7;color:#3d3222}
.qa-select{width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;padding:11px 14px;border:2px solid #e3d7bc;border-radius:12px;background:#fdfcf9;color:#3d3222}
.qa-text:focus,.qa-select:focus{outline:none;border-color:var(--accent)}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-emblem" aria-hidden="true">
        <svg viewBox="0 0 48 48" class="emblem-svg">
          <path d="M24 2 L29 12 L40 8 L36 19 L46 24 L36 29 L40 40 L29 36 L24 46 L19 36 L8 40 L12 29 L2 24 L12 19 L8 8 L19 12 Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="24" cy="24" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="24" cy="24" r="2.6" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>কুরআন ও হাদিস</h1>
        <p>প্রতিদিনের ইসলামিক সঙ্গী</p>
      </div>
    </div>
    <div class="topbar-ar" lang="ar">القرآن والحديث</div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" aria-label="প্রধান মেনু"></nav>

</div>

<script src="js/data-amol.js"></script>
<script src="js/data-amol-detail.js"></script>
<script src="js/data-duas.js"></script>
<script src="js/data-hadiths.js"></script>
<script src="js/data-quran.js"></script>
<script src="js/translit.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/qa.js"></script>
</body>
</html>
